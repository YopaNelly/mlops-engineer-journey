<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Data Quality Report</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px; }
    .verdict {
      font-size: 48px;
      font-weight: bold;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: white;
      /* This is the ENTIRE point of the Challenge answer:
         one huge colored banner, readable from across a room,
         before anyone reads a single word. */
      background-color: green;
    }
    .meta { color: #666; margin-top: 10px; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 30px; background: white; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #eee; }
    .no-issues { color: #888; font-style: italic; }
  </style>
</head>
<body>

  <div class="verdict">
    ✓ PASSED
  </div>
  <div class="meta">
    3 rows checked · 2026-08-06T21:49:36.672863
  </div>

  <table>
    <tr><th>Check</th><th>Column</th><th>Issue Count</th></tr>

    
      
    
      
    
      
    

    
    <tr><td colspan="3" class="no-issues">No issues found in any check.</td></tr>
    
  </table>

</body>
</html>
